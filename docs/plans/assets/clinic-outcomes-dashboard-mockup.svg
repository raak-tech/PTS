<text x="24" y="540" font-size="12" font-weight="600" fill="#1E2A2A">Privacy &amp; scope</text>
<text x="24" y="560" font-size="12" fill="#6C7B7B">Aggregate &amp; de-identified; every metric shows n; cells with n&lt;5 suppressed. "PTS program" = engagement with PTS practices;</text>
