name: ci-web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-web:
    name: apps/web eslint + playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: pts
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U runner -d pts"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://runner:runner@127.0.0.1:5433/pts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run tests
        working-directory: apps/web
        env:
          CI: true
        run: npm test
